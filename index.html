<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>君子之盾</title>
<style>
  :root{
    --bg:#0C0A08; --panel:rgba(18,15,11,.93); --panel-edge:#8A7233;
    --ivory:#E9E1CE; --ivory-dim:#B7AC93; --gold:#C9A227; --gold-soft:#A6883B;
    --crimson:#9E2B20; --steel:#7E93A8;
    --font-kai:"Kaiti SC","STKaiti","KaiTi","AR PL KaitiM GB","TW-Kai","Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg); overflow:hidden; font-family:var(--font-kai); color:var(--ivory);
    -webkit-user-select:none; user-select:none; touch-action:manipulation}
  #app{position:fixed; inset:0}
  #app canvas{display:block}
  /* 暗角 */
  #vignette{position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.55) 100%)}
  /* ---------- HUD ---------- */
  #hud{position:fixed; top:18px; left:22px; right:64px; display:flex; justify-content:space-between;
    pointer-events:none; z-index:10; font-size:15.5px; letter-spacing:.08em; color:var(--ivory)}
  #hud .chip{background:rgba(14,11,8,.72); border:1px solid var(--panel-edge); padding:4px 14px;
    border-radius:2px; backdrop-filter:blur(3px)}
  #mutebtn{position:fixed; top:16px; right:18px; z-index:40; width:34px; height:34px; font-size:15px;
    background:rgba(14,11,8,.72); border:1px solid var(--panel-edge); border-radius:2px; cursor:pointer;
    font-family:var(--font-kai); color:var(--gold)}
  #mutebtn:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  /* ---------- 决斗 HUD ---------- */
  #dhud{position:fixed; top:18px; left:0; right:0; z-index:10; display:none; pointer-events:none;
    padding:0 64px 0 26px}
  #dhud.show{display:flex; justify-content:space-between}
  .fcard{width:300px; background:rgba(14,11,8,.66); border:1px solid var(--panel-edge);
    padding:10px 14px 12px; backdrop-filter:blur(3px)}
  .fcard.right{text-align:right}
  .fcard .nm{font-size:17px; letter-spacing:.1em; color:var(--ivory); margin-bottom:7px}
  .fcard .nm small{color:var(--ivory-dim); font-size:12.5px; margin:0 6px}
  .bar{height:9px; background:rgba(255,255,255,.09); border:1px solid rgba(201,162,39,.35);
    margin-bottom:6px; position:relative; overflow:hidden}
  .bar i{position:absolute; top:0; bottom:0; left:0; transition:width .12s linear}
  .fcard.right .bar i{left:auto; right:0}
  .bar.qi i{background:linear-gradient(90deg,#C9A227,#E4C465)}
  .bar.ti i{background:linear-gradient(90deg,#5E7488,#8CA6BC)}
  .fcard .st{font-size:13px; color:var(--ivory-dim); letter-spacing:.15em; margin-top:2px}
  .fcard .st b{color:var(--gold); font-weight:600}
  #roundname{position:fixed; top:24px; left:0; right:0; text-align:center; z-index:9; pointer-events:none;
    font-size:16px; letter-spacing:.3em; text-indent:.3em; color:var(--gold)}
  /* ---------- banner & caption ---------- */
  #banner{position:fixed; top:33%; left:0; right:0; text-align:center; pointer-events:none; z-index:20;
    font-size:52px; letter-spacing:.4em; text-indent:.4em; color:var(--ivory);
    text-shadow:0 0 26px rgba(201,162,39,.55), 0 2px 6px rgba(0,0,0,.9); opacity:0; transition:opacity .5s}
  #caption{position:fixed; bottom:84px; left:0; right:0; text-align:center; pointer-events:none; z-index:20;
    font-size:17.5px; opacity:0; transition:opacity .35s; padding:0 60px; line-height:1.7}
  #caption .inner{display:inline-block; background:rgba(10,8,6,.82); border:1px solid var(--panel-edge);
    padding:7px 22px; color:var(--ivory)}
  #hint{position:fixed; bottom:14px; left:0; right:0; text-align:center; pointer-events:none; z-index:10;
    font-size:13px; color:var(--ivory-dim); opacity:.9; letter-spacing:.06em;
    text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #salutetip{position:fixed; top:66%; left:0; right:0; text-align:center; pointer-events:none; z-index:12;
    font-size:20px; color:var(--gold); letter-spacing:.2em; display:none;
    text-shadow:0 2px 8px rgba(0,0,0,.9)}
  /* ---------- overlay panel ---------- */
  #overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(4,3,2,.45); z-index:50}
  #overlay.show{display:flex}
  #overlay.side{justify-content:flex-end; padding-right:40px; background:rgba(4,3,2,.18)}
  #overlay.side .panel{width:470px; max-height:92%}
  #overlay.side .panel p{font-size:14.5px; line-height:1.75; margin-bottom:8px}
  .panel{width:660px; max-width:92%; max-height:88%; overflow-y:auto; background:var(--panel);
    border:1px solid var(--panel-edge); box-shadow:0 0 0 1px rgba(0,0,0,.8), 0 24px 70px rgba(0,0,0,.7);
    padding:30px 40px 26px; backdrop-filter:blur(6px)}
  .panel h2{font-size:24px; letter-spacing:.24em; color:var(--gold); margin-bottom:4px; font-weight:600;
    text-wrap:balance}
  .panel .rule{height:1px; background:linear-gradient(90deg,var(--gold-soft),transparent); margin:12px 0 18px}
  .panel p{font-size:17px; line-height:1.95; margin-bottom:12px; color:var(--ivory)}
  .panel p em{font-style:normal; color:#E0B33C}
  .panel p.quiet{color:var(--ivory-dim); font-size:15px}
  .choices{display:flex; flex-direction:column; gap:10px; margin-top:20px}
  .choices button{font-family:var(--font-kai); font-size:17px; text-align:left; letter-spacing:.05em;
    background:rgba(255,255,255,.03); color:var(--ivory); border:1px solid var(--panel-edge);
    padding:11px 18px; cursor:pointer; line-height:1.5; transition:background .15s,border-color .15s}
  .choices button .sub{display:block; font-size:13px; color:var(--ivory-dim); margin-top:3px}
  .choices button:hover:not(:disabled), .choices button:focus-visible{
    background:rgba(201,162,39,.16); border-color:var(--gold)}
  .choices button:focus-visible{outline:1px solid var(--gold); outline-offset:2px}
  .choices button:disabled{opacity:.4; cursor:not-allowed}
  /* ---------- title ---------- */
  #title{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:linear-gradient(rgba(6,5,3,.25), rgba(6,5,3,.62))}
  #title h1{font-size:96px; font-weight:600; letter-spacing:.22em; text-indent:.22em; color:var(--ivory);
    text-shadow:0 0 40px rgba(201,162,39,.5), 0 4px 14px rgba(0,0,0,.95)}
  #title .en{font-size:14px; letter-spacing:.6em; text-indent:.6em; color:var(--gold); margin-top:10px;
    text-transform:uppercase; font-family:Georgia,"Times New Roman",serif}
  #title .motto{margin-top:30px; font-size:18px; color:var(--ivory-dim); letter-spacing:.14em;
    text-shadow:0 2px 6px rgba(0,0,0,.9)}
  #title button{margin-top:44px; font-family:var(--font-kai); font-size:21px; letter-spacing:.5em;
    text-indent:.5em; padding:12px 52px; background:rgba(201,162,39,.12); color:var(--gold);
    border:1px solid var(--gold); cursor:pointer; transition:background .2s}
  #title button:hover,#title button:focus-visible{background:rgba(201,162,39,.3); color:var(--ivory)}
  #title button:focus-visible{outline:1px solid var(--gold); outline-offset:3px}
  /* ---------- touch ---------- */
  #touch{position:fixed; inset:0; z-index:30; display:none; pointer-events:none}
  body.touch #touch{display:block}
  .tbtn{position:absolute; pointer-events:auto; width:60px; height:60px; border-radius:50%;
    background:rgba(14,11,8,.5); border:1px solid var(--panel-edge); color:var(--ivory);
    font-family:var(--font-kai); font-size:17px; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(2px)}
  .tbtn:active{background:rgba(201,162,39,.5); color:#0C0A08}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="hud"></div>
<div id="dhud">
  <div class="fcard" id="fc-p">
    <div class="nm">你</div>
    <div class="bar qi"><i style="width:100%"></i></div>
    <div class="bar ti"><i style="width:100%"></i></div>
    <div class="st">架势 · <b>中段</b></div>
  </div>
  <div class="fcard right" id="fc-e">
    <div class="nm">对手</div>
    <div class="bar qi"><i style="width:100%"></i></div>
    <div class="bar ti"><i style="width:100%"></i></div>
    <div class="st"><b>中段</b> · 架势</div>
  </div>
</div>
<div id="roundname"></div>
<button id="mutebtn" title="声音开关" aria-label="声音开关">♪</button>
<div id="banner"></div>
<div id="salutetip"></div>
<div id="caption"><span class="inner"></span></div>
<div id="hint"></div>
<div id="touch"></div>
<div id="overlay"><div class="panel" id="panelbox"></div></div>
<div id="title">
  <h1>君子之盾</h1>
  <div class="en">A Junzi's Shield</div>
  <div class="motto">天下失序之时，一个人的操守还算数吗。</div>
  <button id="startbtn">启　程</button>
</div>
