<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>君子之盾</title>
<style>
  :root{
    --parchment:#E8DCC3; --parchment-deep:#DECfa9; --ink:#2B2118; --ink-soft:#4A3D2E;
    --vermilion:#A63A2B; --indigo:#3A4A5A; --gold:#B8863B; --green:#5A6B4D;
    --font-kai:"Kaiti SC","STKaiti","KaiTi","AR PL KaitiM GB","TW-Kai","Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#1E1812; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-kai); color:var(--ink); overflow:hidden;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  #stage{position:relative; width:960px; height:600px; max-width:100vw; max-height:100vh;
    transform-origin:center center; box-shadow:0 0 60px rgba(0,0,0,.6)}
  canvas{display:block; background:var(--parchment)}
  /* ---------- HUD ---------- */
  #hud{position:absolute; top:20px; left:24px; right:68px; display:flex; justify-content:space-between;
    pointer-events:none; font-size:16px; color:var(--ink-soft); letter-spacing:.06em}
  #hud .chip{background:rgba(232,220,195,.85); border:1.5px solid var(--ink); padding:2px 12px;
    border-radius:2px; box-shadow:2px 2px 0 rgba(43,33,24,.25)}
  #mutebtn{position:absolute; top:18px; right:20px; z-index:40; width:34px; height:34px; font-size:16px;
    background:rgba(232,220,195,.85); border:1.5px solid var(--ink); border-radius:2px; cursor:pointer;
    font-family:var(--font-kai); color:var(--ink)}
  #mutebtn:focus-visible{outline:2px solid var(--vermilion); outline-offset:2px}
  /* ---------- banner & caption ---------- */
  #banner{position:absolute; top:34%; left:0; right:0; text-align:center; pointer-events:none;
    font-size:44px; letter-spacing:.35em; text-indent:.35em; color:var(--vermilion);
    text-shadow:1px 1px 0 rgba(232,220,195,.9); opacity:0; transition:opacity .4s}
  #caption{position:absolute; bottom:64px; left:0; right:0; text-align:center; pointer-events:none;
    font-size:18px; color:var(--ink); opacity:0; transition:opacity .35s; padding:0 60px; line-height:1.7}
  #caption .inner{display:inline-block; background:rgba(232,220,195,.92); border:1px solid var(--ink-soft);
    padding:6px 20px; box-shadow:3px 3px 0 rgba(43,33,24,.2)}
  #hint{position:absolute; bottom:10px; left:0; right:0; text-align:center; pointer-events:none;
    font-size:13.5px; color:var(--ink-soft); opacity:.85; letter-spacing:.04em}
  /* ---------- overlay panel ---------- */
  #overlay{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(30,24,18,.45); z-index:50}
  #overlay.show{display:flex}
  #overlay.side{justify-content:flex-end; padding-right:34px; background:rgba(30,24,18,.12)}
  #overlay.side .panel{width:470px; max-height:92%}
  #overlay.side .panel p{font-size:15px; line-height:1.75; margin-bottom:8px}
  .panel{width:640px; max-width:92%; max-height:88%; overflow-y:auto; background:var(--parchment);
    border:2px solid var(--ink); box-shadow:0 0 0 6px var(--parchment), 0 0 0 7.5px var(--ink), 8px 10px 0 rgba(0,0,0,.35);
    padding:30px 38px 26px}
  .panel h2{font-size:25px; letter-spacing:.2em; color:var(--ink); margin-bottom:4px; font-weight:600;
    text-wrap:balance}
  .panel h2::before{content:"❖ "; color:var(--vermilion); letter-spacing:0}
  .panel .rule{height:2px; background:var(--ink); margin:10px 0 16px; position:relative}
  .panel .rule::after{content:""; position:absolute; right:0; top:-3px; width:8px; height:8px;
    background:var(--vermilion); transform:rotate(45deg)}
  .panel p{font-size:17.5px; line-height:1.95; margin-bottom:12px; color:var(--ink)}
  .panel p em{font-style:normal; color:var(--vermilion)}
  .panel p.quiet{color:var(--ink-soft); font-size:15.5px}
  .choices{display:flex; flex-direction:column; gap:10px; margin-top:20px}
  .choices button{font-family:var(--font-kai); font-size:17.5px; text-align:left; letter-spacing:.05em;
    background:var(--parchment); color:var(--ink); border:1.5px solid var(--ink); padding:10px 16px;
    cursor:pointer; line-height:1.5; transition:background .12s,color .12s; border-radius:2px}
  .choices button .sub{display:block; font-size:13.5px; color:var(--ink-soft); margin-top:2px}
  .choices button:hover:not(:disabled), .choices button:focus-visible{background:var(--vermilion); color:var(--parchment)}
  .choices button:hover:not(:disabled) .sub, .choices button:focus-visible .sub{color:#EED9C0}
  .choices button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .choices button:disabled{opacity:.45; cursor:not-allowed}
  /* ---------- title ---------- */
  #title{position:absolute; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:0; background:transparent}
  #title h1{font-size:88px; font-weight:600; letter-spacing:.18em; text-indent:.18em; color:var(--ink);
    text-shadow:3px 3px 0 rgba(166,58,43,.25)}
  #title .en{font-size:15px; letter-spacing:.5em; text-indent:.5em; color:var(--ink-soft); margin-top:6px;
    text-transform:uppercase; font-family:Georgia,"Times New Roman",serif}
  #title .motto{margin-top:26px; font-size:18px; color:var(--ink-soft); letter-spacing:.12em}
  #title button{margin-top:38px; font-family:var(--font-kai); font-size:22px; letter-spacing:.4em;
    text-indent:.4em; padding:10px 42px; background:var(--vermilion); color:var(--parchment);
    border:2px solid var(--ink); cursor:pointer; border-radius:2px; box-shadow:4px 4px 0 rgba(43,33,24,.4)}
  #title button:hover,#title button:focus-visible{background:#8C2F22}
  #title button:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  /* ---------- touch controls ---------- */
  #touch{position:absolute; inset:0; z-index:30; display:none; pointer-events:none}
  body.touch #touch{display:block}
  .tbtn{position:absolute; pointer-events:auto; width:58px; height:58px; border-radius:50%;
    background:rgba(232,220,195,.55); border:1.5px solid var(--ink); color:var(--ink);
    font-family:var(--font-kai); font-size:17px; display:flex; align-items:center; justify-content:center}
  .tbtn:active{background:rgba(166,58,43,.75); color:var(--parchment)}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="600"></canvas>
  <div id="hud"></div>
  <button id="mutebtn" title="声音开关" aria-label="声音开关">♪</button>
  <div id="banner"></div>
  <div id="caption"><span class="inner"></span></div>
  <div id="hint"></div>
  <div id="touch"></div>
  <div id="overlay"><div class="panel" id="panelbox"></div></div>
  <div id="title">
    <h1>君子之盾</h1>
    <div class="en">A Junzi's Shield</div>
    <div class="motto">天下失序之时，一个人的操守还算数吗。</div>
    <button id="startbtn">启　程</button>
  </div>
</div>
<script>
(() => {
'use strict';
/* ================= 基础 ================= */
const W=960, H=600;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const C={parch:'#E8DCC3', parchDeep:'#DECFA9', ink:'#2B2118', inkSoft:'#4A3D2E',
  verm:'#A63A2B', indigo:'#3A4A5A', gold:'#B8863B', green:'#5A6B4D', river:'#8CA3AE', road:'#C9B189'};
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

/* 适配缩放 */
function fit(){
  const s=Math.min(innerWidth/W, innerHeight/H, 1.4);
  $('#stage').style.transform=`scale(${s})`;
}
addEventListener('resize',fit); fit();

/* ================= 声音（WebAudio 简音效） ================= */
let AC=null, muted=false;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(f,dur,type='square',vol=0.05,slide=0){
  if(muted) return;
  try{
    const a=ac(), o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=f;
    if(slide) o.frequency.linearRampToValueAtTime(f+slide, a.currentTime+dur);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
const sfx={
  clang(){ tone(1750,.09,'square',.045); tone(920,.14,'sawtooth',.03,-300); },
  hit(){ tone(150,.16,'sawtooth',.07,-60); tone(90,.2,'triangle',.06); },
  swing(){ tone(360,.08,'sine',.03,220); },
  shove(){ tone(120,.14,'square',.05,-40); },
  step(){ tone(220,.03,'triangle',.015); },
  horn(){ tone(392,.35,'sawtooth',.04); setTimeout(()=>tone(523,.55,'sawtooth',.045),240); },
  coin(){ tone(1320,.1,'sine',.04); setTimeout(()=>tone(1760,.15,'sine',.035),70); },
  yield_(){ tone(660,.3,'sine',.04,-160); },
};
$('#mutebtn').addEventListener('click',()=>{ muted=!muted; $('#mutebtn').textContent=muted?'∅':'♪'; });

/* ================= 游戏状态 ================= */
const G={
  scene:'title',
  v:{ren:0, yi:0, li:0, zhi:0, xin:0, shendu:0},   // 五常与慎独，永不显示数值
  coins:8,
  deeds:[],        // 判词素材
  hiddenDeeds:[],  // 慎独之行，另册记之
  stains:[],       // 污点
  oaths:[],        // {text, kept:null|true|false}
  flags:{},
  round:0,
};
function deed(t){ G.deeds.push(t); }
function stain(t){ G.stains.push(t); }

/* ================= HUD / 文案挂件 ================= */
function hud(){
  const el=$('#hud');
  if(G.scene==='map'){
    el.innerHTML=`<span class="chip">钱袋 · ${G.coins} 银</span>
      <span class="chip">${G.oaths.length?('誓约 · '+G.oaths.length+' 则'):'圣奥仑大会 · 三日后'}</span>`;
  }else el.innerHTML='';
}
let bannerT=null;
function banner(t,ms=1300){
  const b=$('#banner'); b.textContent=t; b.style.opacity=1;
  clearTimeout(bannerT); bannerT=setTimeout(()=>b.style.opacity=0,ms);
}
let capT=null;
function caption(t,ms=3200){
  const c=$('#caption'); c.querySelector('.inner').textContent=t; c.style.opacity=1;
  clearTimeout(capT); capT=setTimeout(()=>c.style.opacity=0,ms);
}
function hint(t){ $('#hint').textContent=t||''; }

/* ================= 面板系统 ================= */
const overlay=$('#overlay'), panelbox=$('#panelbox');
let panelOpen=false;
function showPanel({title,body,choices,quiet}){
  panelOpen=true; overlay.classList.add('show');
  let html=`<h2>${title}</h2><div class="rule"></div>`;
  for(const p of body) html+=`<p>${p}</p>`;
  if(quiet) html+=`<p class="quiet">${quiet}</p>`;
  html+=`<div class="choices"></div>`;
  panelbox.innerHTML=html;
  const box=panelbox.querySelector('.choices');
  choices.forEach(c=>{
    const b=document.createElement('button');
    b.innerHTML=c.label+(c.sub?`<span class="sub">${c.sub}</span>`:'');
    if(c.disabled) b.disabled=true;
    b.addEventListener('click',()=>{ closePanel(); c.fx&&c.fx(); });
    box.appendChild(b);
  });
  const first=box.querySelector('button:not(:disabled)'); first&&first.focus();
}
function closePanel(){ panelOpen=false; overlay.classList.remove('show'); hud(); }

/* ================= 输入 ================= */
const keys={}, pressed={};   /* keys=按住状态；pressed=单次敲击队列，每帧消费 */
addEventListener('keydown',e=>{
  if(panelOpen) return;
  keys[e.code]=true;
  if(!e.repeat) pressed[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);
function clearPressed(){ for(const k in pressed) delete pressed[k]; }
/* 触屏 */
const isTouch=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
if(isTouch){
  document.body.classList.add('touch');
  const defs=[
    {t:'◀',x:24,y:H-118,k:'KeyA'},{t:'▶',x:98,y:H-118,k:'KeyD'},
    {t:'▲',x:61,y:H-186,k:'KeyW'},{t:'▼',x:61,y:H-50,k:'KeyS'},
    {t:'击',x:W-92,y:H-140,k:'KeyJ'},{t:'撞',x:W-164,y:H-92,k:'KeyK'},
  ];
  const tc=$('#touch');
  defs.forEach(d=>{
    const b=document.createElement('div'); b.className='tbtn'; b.textContent=d.t;
    b.style.left=d.x+'px'; b.style.top=(d.y-58)+'px';
    b.addEventListener('pointerdown',e=>{e.preventDefault(); keys[d.k]=true; pressed[d.k]=true;});
    b.addEventListener('pointerup',()=>keys[d.k]=false);
    b.addEventListener('pointerleave',()=>keys[d.k]=false);
    tc.appendChild(b);
  });
}

/* ================= 通用绘制 ================= */
let speck=null;
function parchment(){
  ctx.fillStyle=C.parch; ctx.fillRect(0,0,W,H);
  if(!speck){
    speck=document.createElement('canvas'); speck.width=W; speck.height=H;
    const s=speck.getContext('2d');
    for(let i=0;i<900;i++){
      s.fillStyle=`rgba(74,61,46,${0.02+Math.random()*0.05})`;
      s.fillRect(Math.random()*W,Math.random()*H,1.6,1.6);
    }
    for(let i=0;i<7;i++){
      s.fillStyle='rgba(160,130,80,0.05)';
      s.beginPath(); s.ellipse(Math.random()*W,Math.random()*H,60+Math.random()*120,40+Math.random()*80,Math.random()*3,0,7); s.fill();
    }
  }
  ctx.drawImage(speck,0,0);
}
function frame(){ /* 挂毯式边框 */
  ctx.save();
  ctx.strokeStyle=C.ink; ctx.lineWidth=3; ctx.strokeRect(6.5,6.5,W-13,H-13);
  ctx.strokeStyle=C.verm; ctx.lineWidth=1.5; ctx.strokeRect(12.5,12.5,W-25,H-25);
  ctx.fillStyle=C.gold;
  for(const [x,y] of [[6,6],[W-14,6],[6,H-14],[W-14,H-14]]) ctx.fillRect(x,y,8,8);
  ctx.restore();
}
function sealChar(x,y,ch,size=30,earned=true){ /* 朱砂印 */
  ctx.save();
  ctx.translate(x,y);
  if(earned){
    ctx.fillStyle=C.verm;
    ctx.strokeStyle=C.ink; ctx.lineWidth=2;
    rrect(-size*0.72,-size*0.72,size*1.44,size*1.44,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.parch;
  }else{
    ctx.strokeStyle='rgba(74,61,46,.4)'; ctx.lineWidth=1.5;
    rrect(-size*0.72,-size*0.72,size*1.44,size*1.44,4); ctx.stroke();
    ctx.fillStyle='rgba(74,61,46,.35)';
  }
  ctx.font=`600 ${size}px ${'Kaiti SC,STKaiti,KaiTi,serif'}`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(ch,0,size*0.06);
  ctx.restore();
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ================= 俯视行游 ================= */
const MAP={w:1700,h:1100};
const player={x:210,y:930,a:0,speed:175};
const LOCS=[
  {id:'village', x:520,y:430, r:70, name:'沙溪村', done:false},
  {id:'forest',  x:860,y:250, r:80, name:'黑桦林', done:false},
  {id:'ford',    x:1030,y:780,r:70, name:'苇渡口', done:false},
  {id:'field',   x:1450,y:330,r:85, name:'圣奥仑比武场', done:false},
];
const TREES=[]; { let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  for(let i=0;i<46;i++) TREES.push({x:700+rnd()*380,y:120+rnd()*300,s:14+rnd()*14});
  for(let i=0;i<20;i++) TREES.push({x:120+rnd()*350,y:120+rnd()*300,s:12+rnd()*16});
}
const roadPts=[[210,930],[380,760],[520,470],[700,380],[860,300],[1030,740],[1240,560],[1450,370]];

function drawMap(){
  parchment();
  const camX=clamp(player.x-W/2,0,MAP.w-W), camY=clamp(player.y-H/2,0,MAP.h-H);
  ctx.save(); ctx.translate(-camX,-camY);
  /* 河 */
  ctx.strokeStyle=C.river; ctx.lineWidth=46; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(760,1100); ctx.quadraticCurveTo(980,830,1120,660);
  ctx.quadraticCurveTo(1260,480,1700,430); ctx.stroke();
  ctx.strokeStyle='rgba(58,74,90,.5)'; ctx.lineWidth=2;
  for(const off of [-12,2,14]){
    ctx.beginPath(); ctx.moveTo(760,1100+off); ctx.quadraticCurveTo(980,830+off,1120,660+off);
    ctx.quadraticCurveTo(1260,480+off,1700,430+off); ctx.stroke();
  }
  /* 渡口桥板 */
  ctx.fillStyle=C.road; ctx.save(); ctx.translate(1035,762); ctx.rotate(-0.7);
  ctx.fillRect(-16,-46,32,92); ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.strokeRect(-16,-46,32,92); ctx.restore();
  /* 路 */
  ctx.strokeStyle=C.road; ctx.lineWidth=26; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(roadPts[0][0],roadPts[0][1]);
  for(const p of roadPts.slice(1)) ctx.lineTo(p[0],p[1]); ctx.stroke();
  ctx.setLineDash([10,14]); ctx.strokeStyle='rgba(74,61,46,.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(roadPts[0][0],roadPts[0][1]);
  for(const p of roadPts.slice(1)) ctx.lineTo(p[0],p[1]); ctx.stroke(); ctx.setLineDash([]);
  /* 树 */
  for(const t of TREES){
    ctx.fillStyle=C.green; ctx.strokeStyle=C.ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(t.x,t.y,t.s,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(43,33,24,.55)'; ctx.fillRect(t.x-2,t.y+t.s-4,4,8);
  }
  /* 村庄 */
  drawVillage(470,400);
  /* 营地 */
  drawTent(180,950);
  /* 比武场 */
  drawField(1450,330);
  /* 信使（渡口，未处理时可见） */
  const ford=LOCS.find(l=>l.id==='ford');
  if(!ford.done){
    ctx.save(); ctx.translate(1000,820); ctx.rotate(0.9);
    ctx.fillStyle=C.indigo; rrect(-6,-16,12,32,5); ctx.fill();
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,-22,6,0,7); ctx.fillStyle='#C9A227'; ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  /* 地名 */
  ctx.font='600 19px '+'Kaiti SC,STKaiti,KaiTi,serif';
  ctx.textAlign='center'; ctx.fillStyle=C.inkSoft;
  for(const l of LOCS){
    ctx.fillText(l.name,l.x,l.y-l.r-10);
    if(!l.done && l.id!=='field'){
      ctx.fillStyle=C.verm; ctx.fillText('·',l.x,l.y-l.r+8); ctx.fillStyle=C.inkSoft;
    }
  }
  /* 玩家（骑马俯视） */
  ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.a);
  ctx.fillStyle='#6B5138'; ctx.strokeStyle=C.ink; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,0,26,11,0,0,7); ctx.fill(); ctx.stroke();      // 马身
  ctx.beginPath(); ctx.ellipse(30,0,8,5,0,0,7); ctx.fill(); ctx.stroke();       // 马首
  ctx.fillStyle=C.indigo; ctx.beginPath(); ctx.arc(-2,0,8,0,7); ctx.fill(); ctx.stroke(); // 骑者
  ctx.fillStyle=C.gold; ctx.beginPath(); ctx.ellipse(-2,-9,7,4,0,0,7); ctx.fill(); ctx.stroke(); // 盾
  ctx.strokeStyle=C.inkSoft; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(6,6); ctx.lineTo(46,10); ctx.stroke(); // 枪
  ctx.restore();
  ctx.restore();
  /* 罗盘 */
  ctx.save(); ctx.translate(W-58,H-58);
  ctx.fillStyle='rgba(232,220,195,.9)'; ctx.strokeStyle=C.ink; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,26,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle=C.verm; ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(5,4); ctx.lineTo(-5,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.ink; ctx.font='11px serif'; ctx.textAlign='center'; ctx.fillText('北',0,17);
  ctx.restore();
  frame();
}
function drawVillage(x,y){
  for(const [dx,dy] of [[0,0],[70,26],[24,64],[92,80]]){
    ctx.save(); ctx.translate(x+dx,y+dy);
    ctx.fillStyle=C.parchDeep; ctx.strokeStyle=C.ink; ctx.lineWidth=2;
    ctx.fillRect(-18,-12,36,26); ctx.strokeRect(-18,-12,36,26);

/* --- 决斗逻辑 --- */
function fTick(f,dt){
  f.t-=dt; f.shoveCd-=dt; f.atkCd-=dt; f.stanceCd-=dt;
  f.blockFlash-=dt; f.hurtFlash-=dt;
  if(f.exhaust>0){ f.exhaust-=dt; }
  else f.stam=clamp(f.stam+(f.state==='idle'?16:8)*dt,0,100);
}
function tryAttack(f){
  if(f.state!=='idle'||f.atkCd>0||f.exhaust>0) return false;
  if(f.stam<24){ return false; }
  f.stam-=24; f.state='windup'; f.strikeStance=f.stance; f.feinted=false;
  f.t=(f===duel.p?0.36:(duel.cfg.windup+(duel.intel&&f===duel.e?140:0))/1000);
  return true;
}
function tryShove(f,g){
  if(f.state!=='idle'||f.shoveCd>0||f.exhaust>0||f.stam<20) return;
  f.shoveCd=0.9; f.stam-=20;
  if(Math.abs(f.x-g.x)<86 && g.state!=='stagger'){
    if(g.state==='windup'||g.state==='idle'){
      g.state='stagger'; g.t=0.68; sfx.shove();
      caption2('撞盾！'+(g===duel.e?'对手趔趄了':'你被撞得趔趄'));
    }
  }else sfx.swing();
}
let cap2T=null;
function caption2(t){ caption(t,1500); }
function setStance(f,dir){
  if(f.stanceCd>0||f.exhaust>0) return;
  const ns=clamp(f.stance+dir,0,2);
  if(ns===f.stance) return;
  f.stance=ns; f.stanceCd=0.09;
  if(f.state==='windup'){ /* 虚招 */
    if(f.stam>=8){ f.stam-=8; f.strikeStance=f.stance; f.feinted=true; }
    else f.stance=f.strikeStance;
  }
}
function resolveStrike(att,def,isPlayerAtt){
  const gap=Math.abs(att.x-def.x);
  att.state='strike'; att.t=0.09; sfx.swing();
  if(gap>128){ return; }
  const canBlock=(def.state==='idle'||def.state==='windup') && def.exhaust<=0 && def.state!=='stagger';
  if(canBlock && def.stance===att.strikeStance){
    def.stam=clamp(def.stam-10,0,100); def.blockFlash=0.3; sfx.clang();
    att.state='recover'; att.t=0.46; att.atkCd=0.5;
    if(!isPlayerAtt) duel.pJustBlocked=true; else duel.eJustBlocked=true;
    return;
  }
  const dmg=isPlayerAtt?22:duel.cfg.dmg;
  def.resolve-=dmg; def.hurtFlash=0.35; sfx.hit();
  def.x=clamp(def.x+(def.x>att.x?26:-26),80,W-80);
  att.state='recover'; att.t=0.3; att.atkCd=0.34;
  if(def.state==='windup') def.state='idle';
  if(def.resolve<=0){
    def.resolve=0;
    if(def===duel.e){ def.state='yield'; duel.over=true; sfx.yield_(); setTimeout(()=>duelWon(),900); }
    else { duel.over=true; setTimeout(()=>duelLost(),700); }
  }
}
function tickDuel(dt){
  const d=duel; if(!d) return;
  const p=d.p, e=d.e;
  if(d.phase==='salute'){
    d.phaseT-=dt;
    p.phaseSalute=d.saluted;
    if((pressed.KeyK||pressed.KeyB) && !d.saluted){
      d.saluted=true; G.v.li++;
      const resp={brigand:'盗匪愣了一下，随即狞笑。',
        talbot:'塔尔博啐了一口，没有还礼。',
        edmund:'埃德蒙爵士郑重举剑还礼。',
        belloc:G.flags.baronGrudge?'贝洛克冷冷道："沙溪村的多事骑士。"草草还了半礼。':'贝洛克微一颔首，还礼。'}[d.foeId];
      caption(resp,3000);
      if(d.foeId==='edmund') e.phaseSalute=true;
      deed_once('salute','临阵向对手行礼，不失骑士之仪');
    }
    if(d.phaseT<=0){
      d.phase='fight'; p.phaseSalute=false; e.phaseSalute=false;
      banner('比武开始',1000);
    }
    return;
  }
  if(d.over){ fTick(p,dt); fTick(e,dt); return; }
  fTick(p,dt); fTick(e,dt);
  /* 玩家操控 */
  if(p.state==='idle'&&p.exhaust<=0){
    let mv=0;
    if(keys.ArrowLeft||keys.KeyA) mv-=1;
    if(keys.ArrowRight||keys.KeyD) mv+=1;
    if(mv) p.x=clamp(p.x+mv*170*dt,80,e.x-52);
  }
  if(pressed.ArrowUp||pressed.KeyW) setStance(p,-1);
  if(pressed.ArrowDown||pressed.KeyS) setStance(p,1);
  if(pressed.KeyJ||pressed.Space) tryAttack(p);
  if(pressed.KeyK||pressed.KeyB) tryShove(p,e);
  if(p.stam<=0&&p.exhaust<=0&&p.state==='idle'){ p.exhaust=1.35; caption2('你力竭了——喘口气！'); }
  /* 玩家攻击结算 */
  if(p.state==='windup'&&p.t<=0) resolveStrike(p,e,true);
  else if(p.state==='strike'&&p.t<=0){ p.state='recover'; }
  else if(p.state==='recover'&&p.t<=0) p.state='idle';
  if(p.state==='stagger'&&p.t<=0) p.state='idle';
  /* AI */
  aiTick(dt); aiMove(dt);
  if(e.state==='windup'&&e.t<=0) resolveStrike(e,p,false);
  else if(e.state==='strike'&&e.t<=0) e.state='recover';
  else if(e.state==='recover'&&e.t<=0) e.state='idle';
  if(e.state==='stagger'&&e.t<=0) e.state='idle';
  if(e.stam<=0&&e.exhaust<=0&&e.state==='idle') e.exhaust=1.35;
}
function aiTick(dt){
  const d=duel, cfg=d.cfg, e=d.e, p=d.p;
  const gap=Math.abs(e.x-p.x);
  /* 反应格挡：读玩家起手式（每次起手只判定一次） */
  if(p.state==='windup'){
    if(d.aiReactT<0) d.aiReactT=cfg.reaction/1000;
    if(d.aiReactT<900){
      d.aiReactT-=dt;
      if(d.aiReactT<=0){
        if(e.state==='idle' && Math.random()<cfg.reactP) e.stance=p.stance;
        d.aiReactT=999; /* 本次起手已判定 */
      }
    }
  } else d.aiReactT=-1;
  /* 还击 */
  if(d.eJustBlocked && cfg.counter && e.state==='idle'){
    d.eJustBlocked=false;
    if(e.stam>30){ tryAttack(e); return; }
  }
  d.aiThink-=dt;
  if(e.state==='windup'){
    /* 虚招 */
    if(!e.feinted && e.t<cfg.windup/2000 && Math.random()<cfg.feintP){
      const ns=[0,1,2].filter(s=>s!==e.stance)[Math.random()<0.5?0:1];
      e.stance=ns; e.strikeStance=ns; e.feinted=true;
    }
    return;
  }
  if(e.state!=='idle'||e.exhaust>0) return;
  if(d.aiThink>0) return;
  d.aiThink=0.12+Math.random()*0.18;
  const wantGap=105;
  /* 追击力竭的玩家 */
  const punish=cfg.name==='贝洛克男爵'&&p.exhaust>0;
  const aggr=cfg.aggr*(punish?2.2:1);
  if(gap>wantGap+18){ d.eMove=-1; }
  else if(gap<70 && Math.random()<0.4){ d.eMove=1; }
  else if(e.stam>(cfg.counter?46:30) && Math.random()<0.22*aggr){ d.eMove=0;
    /* 选择架势后进攻 */
    const r=Math.random(), w=cfg.stanceW;
    e.stance=r<w[0]?0:(r<w[0]+w[1]?1:2);
    tryAttack(e);
  } else if(Math.random()<0.25 && gap<90 && p.blockFlash<=0 && e.stam>40 && Math.random()<0.3){
    d.eMove=0; tryShove(e,p);
  } else if(Math.random()<0.3){
    d.eMove=0;
    /* 变换守势 */
    e.stance=clamp(e.stance+(Math.random()<0.5?-1:1),0,2);
  } else d.eMove=0;
}
function aiMove(dt){
  const d=duel, e=d.e, p=d.p;
  if(!d.eMove||e.state!=='idle'||e.exhaust>0) return;
  e.x=clamp(e.x+d.eMove*d.cfg.speed*dt*(d.eMove<0?1:0.8), p.x+52, W-80);
}

function epithet(){
  const v=G.v;
  if(G.stains.length) return ['蒙尘之盾','德有亏，则盾有尘。尘可拭，痕难平。'];
  const five=[v.ren,v.yi,v.li,v.zhi,v.xin];
  if(five.every(x=>x>=1)) return ['君子之盾','五常俱备，表里如一。此盾无需纹饰，其行即其纹章。'];
  const names=['仁者之盾','守义之盾','知礼之盾','明智之盾','守信之盾'];
  const mx=Math.max(...five);
  if(mx<=0) return ['无铭之盾','一路行来，未曾多事，也未曾多情。盾面干净，也空空如也。'];
  return [names[five.indexOf(mx)],'一德独厚，余者尚缺。行游未尽，来日可期。'];
}

    quiet:'德行从不显示数值。它只是被记住了——被这个王国，也被你自己。',
    choices:[
      {label:'再行游一遭', sub:'另一条路，另一面盾。', fx:()=>location.reload()},
    ],
  });
}
let finaleData=null;
function drawFinale(){
  parchment();
  /* 盾形（居左，右侧留给判词） */
  const cx=232, cy=286, sw=190, sh=234;
  ctx.fillStyle=C.inkSoft; ctx.font='600 24px Kaiti SC,STKaiti,KaiTi,serif'; ctx.textAlign='center';
  ctx.fillText('你 的 盾 面', cx, 92);
  if(finaleData){
    ctx.fillStyle=C.verm; ctx.font='600 30px Kaiti SC,STKaiti,KaiTi,serif';
    ctx.fillText('「'+finaleData.title+'」', cx, cy+sh/2+64);
  }
  ctx.save(); ctx.translate(cx,cy);
  ctx.beginPath();
  ctx.moveTo(-sw/2,-sh/2+14);
  ctx.quadraticCurveTo(0,-sh/2-6,sw/2,-sh/2+14);
  ctx.quadraticCurveTo(sw/2+6,sh*0.18,0,sh/2);
  ctx.quadraticCurveTo(-sw/2-6,sh*0.18,-sw/2,-sh/2+14);
  ctx.closePath();
  ctx.fillStyle=C.parchDeep; ctx.fill();
  ctx.lineWidth=5; ctx.strokeStyle=C.ink; ctx.stroke();
  ctx.lineWidth=2; ctx.strokeStyle=C.gold;
  ctx.save(); ctx.scale(0.92,0.92); ctx.stroke(); ctx.restore();
  if(finaleData){
    const pos=[[0,4],[-46,-56],[46,-56],[-46,58],[46,58]];
    finaleData.chars.forEach((c,i)=>{
      sealChar(pos[i][0],pos[i][1],c[0],26,c[1]>=1);
    });
    if(G.v.shendu>=2&&!G.stains.length){ /* 慎独之星 */
      ctx.fillStyle=C.gold; ctx.strokeStyle=C.ink; ctx.lineWidth=1.5;
      ctx.save(); ctx.translate(0,-sh/2-26);
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const r=i%2?6:14, a=-Math.PI/2+i*Math.PI/5;
        ctx[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    if(G.stains.length){ /* 污痕 */
      ctx.strokeStyle='rgba(30,24,18,.75)'; ctx.lineWidth=9; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-sw/2+18,-sh/2+30); ctx.lineTo(sw/2-30,sh/2-40); ctx.stroke();
    }
  }
  ctx.restore();
  frame();
}
/* ================= 序章 ================= */
function prologue(){
  showPanel({
    title:'序章 · 一纸誓词',
    body:['老王驾崩，无嗣。三家摄政各执玉玺残片，王国<em>裂而未崩</em>：律法还在，却无人执行；道路还通，却盗匪横行。',
      '你是新受封的骑士。无封地，无家名。一马，一剑，一纸誓词。',
      '三日后，圣奥仑比武大会开幕，诸侯齐聚。你的路，从营地前的这条土路开始。'],
    quiet:'本游戏不显示任何德行数值。你的所作所为，这个王国自会记得——终幕时，你的盾面便是你的一生。',
    choices:[{label:'上马', sub:'方向键或 WASD 骑行。路上遇事，皆由你断。', fx:()=>{ hint('方向键 / WASD 骑行 · 朱点为未访之地 · 东北方为比武场'); }}],
  });
}
/* ================= 主循环 ================= */
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05); last=ts;
  if(G.scene==='map'){ if(!panelOpen) tickMap(dt); drawMap(); }
  else if(G.scene==='duel'){ if(!panelOpen) tickDuel(dt); drawDuel(dt); }
  else if(G.scene==='finale'){ drawFinale(); }
  else if(G.scene==='title'){ drawTitleBg(); }
  clearPressed();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* 标题背景：五常印环 */
function drawTitleBg(){
  parchment();
  ctx.globalAlpha=0.22;
  ctx.save(); ctx.translate(W/2,300);
  ['仁','义','礼','智','信'].forEach((ch,i)=>{
    const a=-Math.PI/2+i*(Math.PI*2/5);
    sealChar(Math.cos(a)*205,Math.sin(a)*205,ch,34,true);
  });
  ctx.restore();
  ctx.globalAlpha=1;
  frame();
}
/* 测试钩子（不影响游戏） */
window.__DBG={G, player, LOCS, getDuel:()=>duel, startDuel, EVENTS, finale, shieldScreen};
$('#startbtn').addEventListener('click',()=>{
  ac(); /* 解锁音频 */
  $('#title').style.display='none';
  G.scene='map'; hud(); sfx.horn();
  prologue();
});
})();
</script>
