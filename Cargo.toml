[workspace]
resolver = "2"
members = ["nes-core", "nes-headless", "nes-frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

# 模拟器逐周期热路径在未优化构建下太慢,dev 也开一点优化
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
