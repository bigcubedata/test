<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rnes — 浏览器版 NES 模拟器</title>
<style>
  :root { color-scheme: dark; }
  body { background:#111; color:#ddd; font:14px/1.6 system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:12px; padding:24px; }
  canvas { width:768px; max-width:95vw; aspect-ratio:256/240;
           image-rendering:pixelated; background:#000; border:1px solid #333; }
  .hint { color:#888; font-size:12px; }
  button, input { font:inherit; }
</style>
</head>
<body>
<h1>rnes<span class="hint"> — 周期级 NES 模拟器(Rust → wasm)</span></h1>
<div>
  <input type="file" id="rom" accept=".nes">
  <button id="reset">复位</button>
  <span id="status" class="hint">选择 .nes 文件开始(ROM 不会上传,纯本地运行)</span>
</div>
<canvas id="screen" width="256" height="240"></canvas>
<div class="hint">键盘:方向键 + Z=B X=A + 回车=Start 右Shift=Select;
手柄:USB/蓝牙(含 PS5 DualSense)即插即用,第 1/2 只 → P1/P2 <span id="pads"></span>
<button id="padlearn" title="按键错位/无效时:依次按 A B SELECT START 上 下 左 右">手柄映射(F9)</button> <span id="learn" class="hint"></span></div>
<script type="module">
const W = 256, H = 240;
const status = document.getElementById('status');
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');

let wasm = null, mem = null;
let audioCtx = null, audioBuf = null, audioBufPtr = 0;
let running = false, lastTime = 0, debt = 0;
const FPS = 60.0988;

const resp = await fetch('nes_wasm.wasm');
const { instance } = await WebAssembly.instantiate(await resp.arrayBuffer(), {});
wasm = instance.exports;
mem = wasm.memory;

let buttons = 0;
const KEYMAP = {
  ArrowUp: 0x10, ArrowDown: 0x20, ArrowLeft: 0x40, ArrowRight: 0x80,
  KeyZ: 0x02, KeyX: 0x01, Enter: 0x08, ShiftRight: 0x04,
};
addEventListener('keydown', e => {
  if (e.code === 'F9') { learnKey(); e.preventDefault(); return; }
  const b = KEYMAP[e.code];
  if (b !== undefined) { buttons |= b; e.preventDefault(); }
});
addEventListener('keyup', e => {
  const b = KEYMAP[e.code];
  if (b !== undefined) { buttons &= ~b; e.preventDefault(); }
});

document.getElementById('rom').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const bytes = new Uint8Array(await file.arrayBuffer());
  const ptr = wasm.wasm_alloc(bytes.length);
  new Uint8Array(mem.buffer, ptr, bytes.length).set(bytes);
  if (wasm.load_rom(ptr, bytes.length) !== 0) {
    status.textContent = 'ROM 加载失败(格式或 mapper 不支持)';
    return;
  }
  status.textContent = file.name;
  startAudio();
  if (!running) { running = true; lastTime = performance.now(); requestAnimationFrame(loop); }
});

document.getElementById('reset').addEventListener('click', () => wasm.reset());

function startAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  wasm.set_sample_rate(audioCtx.sampleRate);
  audioBufPtr = wasm.wasm_alloc(4096 * 4);
  const node = audioCtx.createScriptProcessor(1024, 0, 1);
  node.onaudioprocess = ev => {
    const out = ev.outputBuffer.getChannelData(0);
    const n = wasm.audio_take(audioBufPtr, out.length);
    const samples = new Float32Array(mem.buffer, audioBufPtr, n);
    out.set(samples.subarray(0, n));
    for (let i = n; i < out.length; i++) out[i] = 0;
    // 动态速率控制:按积压水位微调
    const pending = wasm.audio_pending();
    const target = audioCtx.sampleRate * 0.04;
    wasm.set_rate_adjust(1.0 + 0.005 * Math.max(-1, Math.min(1, (pending - target) / target)));
  };
  node.connect(audioCtx.destination);
}

const padStatus = document.getElementById('pads');
const learnEl = document.getElementById('learn');
// ---- 自定义映射(按手柄 id 存 localStorage):bind = {t:'b',i} 或 {t:'a',i,s:±1} ----
const NES_NAMES = ['A', 'B', 'SELECT', 'START', '上', '下', '左', '右'];
const NES_BITS = [0x01, 0x02, 0x04, 0x08, 0x10, 0x20, 0x40, 0x80];
let padMaps = {};
try { padMaps = JSON.parse(localStorage.getItem('rnes_padmap') || '{}'); } catch (e) { padMaps = {}; }
let learn = null; // {step, binds, prevB, prevA, id, cooldown}

function startLearn() {
  learn = { step: 0, binds: [], prevB: null, prevA: null, id: null, cooldown: performance.now() + 300 };
  showLearn();
}
function showLearn() {
  if (!learnEl) return;
  learnEl.textContent = learn ? `学习 ${learn.step + 1}/8:请在手柄上按 [${NES_NAMES[learn.step]}](F9 跳过)` : '';
}
function finishLearn() {
  if (learn.id) {
    padMaps[learn.id] = learn.binds;
    try { localStorage.setItem('rnes_padmap', JSON.stringify(padMaps)); } catch (e) {}
    if (learnEl) learnEl.textContent = '映射已保存(' + learn.id.slice(0, 24) + ')';
  } else if (learnEl) learnEl.textContent = '未收到手柄输入,未保存';
  learn = null;
}
function learnTick(gps) {
  if (!learn || performance.now() < learn.cooldown) return;
  for (const gp of gps) {
    if (learn.id && gp.id !== learn.id) continue;
    const curB = gp.buttons.map(b => b.pressed);
    const curA = Array.from(gp.axes);
    const known = learn.id === gp.id && learn.prevB;
    const prevB = known ? learn.prevB : curB.map(() => false);
    const prevA = known ? learn.prevA : curA; // 首见时以当前轴位为基准,静止偏置不算动作
    let bind = null;
    for (let i = 0; i < curB.length; i++) if (curB[i] && !prevB[i]) { bind = { t: 'b', i }; break; }
    if (!bind) for (let j = 0; j < curA.length; j++) {
      const v = curA[j], pv = prevA[j] || 0;
      if (Math.abs(v) > 0.6 && Math.abs(v) <= 1.0 && Math.abs(pv) < 0.3) { bind = { t: 'a', i: j, s: v > 0 ? 1 : -1 }; break; }
    }
    if (!learn.id) {
      if (!bind) continue;           // 尚未认领:出现动作的手柄才成为学习对象
      learn.id = gp.id;
    }
    learn.prevB = curB; learn.prevA = curA;
    if (bind) {
      learn.binds[learn.step] = bind;
      learn.step++;
      learn.cooldown = performance.now() + 300;
      if (learn.step >= 8) { finishLearn(); return; }
      showLearn();
    }
  }
}
function learnKey() {
  if (!learn) { startLearn(); return; }
  learn.binds[learn.step] = null;
  learn.step++;
  learn.cooldown = performance.now() + 300;
  if (learn.step >= 8) finishLearn(); else showLearn();
}
document.getElementById('padlearn')?.addEventListener('click', learnKey);

// 非标准映射手柄常见的方向帽单轴(axes[9]):-1 上 → 顺时针 8 档,松开 ≈ 1.29
function hatMask(v) {
  if (typeof v !== 'number' || v > 1.05 || v < -1.05) return 0;
  const idx = Math.round((v + 1) * 3.5) & 7;
  return [0x10, 0x90, 0x80, 0xA0, 0x20, 0x60, 0x40, 0x50][idx];
}
function padMask(gp) {
  if (!gp) return 0;
  let m = 0;
  const custom = padMaps[gp.id];
  if (custom) {
    custom.forEach((bd, k) => {
      if (!bd) return;
      if (bd.t === 'b') { if (gp.buttons[bd.i] && gp.buttons[bd.i].pressed) m |= NES_BITS[k]; }
      else { const v = gp.axes[bd.i] || 0; if (bd.s > 0 ? v > 0.5 : v < -0.5) m |= NES_BITS[k]; }
    });
    return m;
  }
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  // 标准映射:0=下(✕) 1=右(○) 2=左(□) 3=上(△) 8=Select/Create 9=Start/Options 12-15=十字键
  if (b(1) || b(3)) m |= 0x01;            // NES A
  if (b(0) || b(2)) m |= 0x02;            // NES B
  if (b(8)) m |= 0x04;                    // Select
  if (b(9)) m |= 0x08;                    // Start
  if (b(12)) m |= 0x10;
  if (b(13)) m |= 0x20;
  if (b(14)) m |= 0x40;
  if (b(15)) m |= 0x80;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  if (ax < -0.5) m |= 0x40;
  if (ax > 0.5) m |= 0x80;
  if (ay < -0.5) m |= 0x10;
  if (ay > 0.5) m |= 0x20;
  if (gp.mapping !== 'standard') m |= hatMask(gp.axes[9]);
  return m;
}
function pollPads() {
  const gps = (navigator.getGamepads ? navigator.getGamepads() : []).filter(g => g);
  if (padStatus) padStatus.textContent = gps.length ? `(已连接 ${gps.length} 只${gps.some(g => padMaps[g.id]) ? ',已套用自定义映射' : ''})` : '';
  learnTick(gps);
  if (learn) return [0, 0];
  return [padMask(gps[0]), padMask(gps[1])];
}

function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  debt = Math.min(debt + dt, 3 / FPS);
  let frames = 0;
  while (debt >= 1 / FPS && frames < 3) { debt -= 1 / FPS; frames++; }
  const [pad1, pad2] = pollPads();
  for (let i = 0; i < frames; i++) {
    wasm.set_buttons(buttons | pad1, pad2);
    wasm.run_frame();
  }
  if (frames > 0) {
    const rgba = new Uint8ClampedArray(mem.buffer, wasm.frame_ptr(), W * H * 4);
    ctx.putImageData(new ImageData(rgba, W, H), 0, 0);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
